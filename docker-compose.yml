services:
  db:
    image: postgres:16-alpine
    container_name: mt-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monitor}
      POSTGRES_DB: ${POSTGRES_DB:-monitor}
    volumes:
      - dados-postgres:/var/lib/postgresql/data
      # Backups lógicos: docker compose exec db pg_dump -U monitor monitor > backup.sql
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monitor} -d ${POSTGRES_DB:-monitor}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: mt-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      MT_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-monitor}:${POSTGRES_PASSWORD:-monitor}@db:5432/${POSTGRES_DB:-monitor}
      MT_SECRET_KEY: ${MT_SECRET_KEY:?defina MT_SECRET_KEY no .env}
      MT_FERNET_KEY: ${MT_FERNET_KEY:-}
      MT_ENVIRONMENT: ${MT_ENVIRONMENT:-dev}
      MT_DEBUG: ${MT_DEBUG:-false}
      MT_CONNECTOR_PROCURACAO: ${MT_CONNECTOR_PROCURACAO:-simulador}
      MT_CONNECTOR_COMPENSACAO: ${MT_CONNECTOR_COMPENSACAO:-simulador}
      MT_CONNECTOR_SITUACAO_FISCAL: ${MT_CONNECTOR_SITUACAO_FISCAL:-simulador}
      MT_SCHEDULER_ENABLED: ${MT_SCHEDULER_ENABLED:-true}
      MT_EMAIL_ENABLED: ${MT_EMAIL_ENABLED:-false}
      MT_CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080"]'
      # Integra Contador (opcional; ver docs/INTEGRACAO_RECEITA_FEDERAL.md)
      MT_INTEGRA_CONTADOR_ENABLED: ${MT_INTEGRA_CONTADOR_ENABLED:-false}
      MT_INTEGRA_CONTADOR_BASE_URL: ${MT_INTEGRA_CONTADOR_BASE_URL:-}
      MT_INTEGRA_CONTADOR_TOKEN_URL: ${MT_INTEGRA_CONTADOR_TOKEN_URL:-}
      MT_INTEGRA_CONTADOR_CONSUMER_KEY: ${MT_INTEGRA_CONTADOR_CONSUMER_KEY:-}
      MT_INTEGRA_CONTADOR_CONSUMER_SECRET: ${MT_INTEGRA_CONTADOR_CONSUMER_SECRET:-}
      MT_INTEGRA_CONTADOR_CERT_PATH: ${MT_INTEGRA_CONTADOR_CERT_PATH:-}
      MT_INTEGRA_CONTADOR_CERT_PASSWORD: ${MT_INTEGRA_CONTADOR_CERT_PASSWORD:-}
    volumes:
      # Certificado digital em volume somente leitura (nunca na imagem)
      - ./certificados:/certificados:ro
      - ./data:/app/../data
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: mt-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  dados-postgres:
